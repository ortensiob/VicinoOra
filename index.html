<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#159bc4"><meta name="description" content="VicinoOra — trova quello più vicino e aperto"><link rel="manifest" href="manifest.webmanifest"><title>VicinoOra Beta</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4fbfd;color:#123}header{background:#159bc4;color:white;padding:28px 20px;text-align:center}main{max-width:720px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}input,select,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #ccdfe5;box-sizing:border-box;font-size:16px}button{background:#159bc4;color:white;border:0;font-weight:bold}.status{color:#078a52;font-weight:bold}.hint{color:#667;font-size:14px}</style></head><body><header><h1>📍 VicinoOra</h1><div>Trova quello più vicino. Trova quello aperto.</div><small>Beta 0.2</small></header><main><div class="card"><h2>🔎 Cosa cerchi?</h2><input id="q" placeholder="Es. Lidl, Conad, farmacia..."><h3>📍 Dove?</h3><button onclick="locate()">Usa la mia posizione</button><input id="where" placeholder="Oppure inserisci città o indirizzo"><h3>📏 Raggio</h3><select id="radius"><option value="500">500 m</option><option value="1000">1 km</option><option value="2000">2 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="25000">25 km</option></select><label><input id="open" type="checkbox" checked style="width:auto"> Solo attività aperte</label><button onclick="search()">🔍 CERCA</button><p id="msg" class="hint">Beta gratuita: dati da OpenStreetMap. La versione definitiva userà Google Places.</p></div><div id="results"></div></main><script>let pos=null;function locate(){if(!navigator.geolocation)return msg('Geolocalizzazione non disponibile');navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];document.getElementById('where').value='Posizione attuale';document.getElementById('msg').textContent='Posizione acquisita.'},e=>msg('Permesso posizione non concesso.'))}function msg(x){document.getElementById('msg').textContent=x}async function search(){let q=document.getElementById('q').value.trim();if(!q)return msg('Inserisci cosa vuoi cercare.');let where=document.getElementById('where').value.trim();if(!pos){if(where&&where!=='Posizione attuale'){try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(where),{headers:{'Accept-Language':'it'}});let a=await r.json();if(!a.length)return msg('Posizione non trovata.');pos=[+a[0].lat,+a[0].lon]}catch(e){return msg('Errore nella ricerca della posizione.')}}else return msg('Usa la mia posizione oppure inserisci un indirizzo/città.')}let radius=+document.getElementById('radius').value;msg('Ricerca in corso...');let query=`[out:json][timeout:20];(nwr["name"~"${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}" ,i](around:${radius},${pos[0]},${pos[1]});nwr["brand"~"${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}" ,i](around:${radius},${pos[0]},${pos[1]}););out center tags;`;try{let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});let data=await r.json();let arr=data.elements.map(e=>{let lat=e.lat??e.center.lat,lon=e.lon??e.center.lon,t=e.tags||{};let d=dist(pos[0],pos[1],lat,lon);return{lat,lon,name:t.name||q,addr:[t['addr:street'],t['addr:housenumber'],t['addr:city']].filter(Boolean).join(' '),d,hours:t.opening_hours||''}}).sort((a,b)=>a.d-b.d);document.getElementById('results').innerHTML=arr.length?'<div class="card"><h2>🏆 Migliore scelta</h2>'+card(arr[0])+'</div>'+arr.slice(1).map(card).join(''):'<div class="card">Nessun risultato trovato nel raggio indicato.</div>';msg(arr.length+' risultati trovati.');}catch(e){msg('Errore temporaneo del servizio di ricerca. Riprova.')}}function card(x){return `<div class="card"><h2>${x.name}</h2><div>📍 ${Math.round(x.d)} m${x.addr?' · '+x.addr:''}</div><div class="status">${x.hours?'🕒 Orari: '+x.hours:'🟢 Attività trovata'}</div><button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}','_blank')">🧭 PORTAMI QUI</button></div>`}function dist(a,b,c,d){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}</script></body></html>
