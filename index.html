<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#159bc4"><meta name="description" content="VicinoOra — trova quello più vicino e aperto"><link rel="manifest" href="manifest.webmanifest"><title>VicinoOra Beta</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4fbfd;color:#123}header{background:#159bc4;color:#fff;padding:28px 20px;text-align:center}main{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}input,select,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #ccdfe5;box-sizing:border-box;font-size:16px}button{background:#159bc4;color:#fff;border:0;font-weight:bold}.status{color:#078a52;font-weight:bold}.hint{color:#667;font-size:14px}.small{font-size:13px;color:#667}.loading{opacity:.65}</style></head><body><header><h1>📍 VicinoOra</h1><div>Trova quello più vicino. Trova quello aperto.</div><small>Beta 0.2.1</small></header><main><div class="card"><h2>🔎 Cosa cerchi?</h2><input id="q" placeholder="Es. Lidl, Conad, farmacia..."><h3>📍 Dove?</h3><button onclick="locate()">Usa la mia posizione</button><input id="where" placeholder="Oppure inserisci città o indirizzo"><h3>📏 Raggio</h3><select id="radius"><option value="500">500 m</option><option value="1000">1 km</option><option value="2000">2 km</option><option value="5000" selected>5 km</option><option value="10000">10 km</option><option value="25000">25 km</option></select><label><input id="open" type="checkbox" checked style="width:auto"> Solo attività aperte</label><button id="searchBtn" onclick="search()">🔍 CERCA</button><p id="msg" class="hint">Beta gratuita: dati da OpenStreetMap. Stiamo ottimizzando la ricerca.</p></div><div id="results"></div></main><script>let pos=null;const endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];function msg(x){document.getElementById('msg').textContent=x}function locate(){if(!navigator.geolocation)return msg('Geolocalizzazione non disponibile.');navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];document.getElementById('where').value='Posizione attuale';msg('Posizione acquisita.')},()=>msg('Permesso posizione non concesso.'))}function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}async function geocode(where){const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q='+encodeURIComponent(where);const r=await fetch(url,{headers:{'Accept-Language':'it'}});if(!r.ok)throw new Error('geocoding');const a=await r.json();if(!a.length)throw new Error('notfound');return[+a[0].lat,+a[0].lon]}async function overpass(query){let last;for(const endpoint of endpoints){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);const r=await fetch(endpoint+'?data='+encodeURIComponent(query),{signal:controller.signal,headers:{'Accept':'application/json'}});clearTimeout(timer);if(!r.ok){last=new Error('HTTP '+r.status);continue}return await r.json()}catch(e){last=e}}throw last||new Error('service')}async function search(){const q=document.getElementById('q').value.trim();if(!q)return msg('Inserisci cosa vuoi cercare.');const where=document.getElementById('where').value.trim();if(!pos){if(where&&where!=='Posizione attuale'){try{msg('Cerco la posizione...');pos=await geocode(where)}catch(e){return msg(e.message==='notfound'?'Posizione non trovata.':'Impossibile trovare la posizione.')}}else return msg('Usa la mia posizione oppure inserisci un indirizzo/città.')}const radius=+document.getElementById('radius').value,btn=document.getElementById('searchBtn');btn.disabled=true;btn.classList.add('loading');msg('Ricerca in corso...');document.getElementById('results').innerHTML='';const safe=escapeRegex(q);const query=`[out:json][timeout:15];(nwr["name"~"${safe}",i](around:${radius},${pos[0]},${pos[1]});nwr["brand"~"${safe}",i](around:${radius},${pos[0]},${pos[1]}););out center tags;`;try{const data=await overpass(query),seen=new Set();let arr=data.elements.map(e=>{const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon,t=e.tags||{};if(lat==null||lon==null)return null;const key=(t.name||q)+'|'+lat.toFixed(5)+'|'+lon.toFixed(5);if(seen.has(key))return null;seen.add(key);return{lat,lon,name:t.name||t.brand||q,addr:[t['addr:street'],t['addr:housenumber'],t['addr:postcode'],t['addr:city']].filter(Boolean).join(' '),d:dist(pos[0],pos[1],lat,lon),hours:t.opening_hours||''}}).filter(Boolean).sort((a,b)=>a.d-b.d);if(document.getElementById('open').checked){const known=arr.filter(x=>x.hours),openKnown=known.filter(x=>isOpenNow(x.hours));if(openKnown.length)arr=openKnown;else if(known.length)arr=[]}if(!arr.length)document.getElementById('results').innerHTML='<div class="card"><h3>Nessun risultato affidabile trovato</h3><p class="small">Prova ad aumentare il raggio o a togliere “Solo attività aperte”. Gli orari OpenStreetMap non sono disponibili per tutti i negozi.</p></div>';else document.getElementById('results').innerHTML='<div class="card"><h2>🏆 Migliore scelta</h2>'+card(arr[0])+'</div>'+arr.slice(1,20).map(card).join('');msg(arr.length+' risultati trovati.')}catch(e){msg('Il servizio di ricerca è momentaneamente lento o non disponibile. Riprova tra qualche secondo.')}finally{btn.disabled=false;btn.classList.remove('loading')}}function card(x){return `<div><h2>${esc(x.name)}</h2><div>📍 ${x.d<1000?Math.round(x.d)+' m':(x.d/1000).toFixed(1)+' km'}${x.addr?' · '+esc(x.addr):''}</div><div class="status">${x.hours?'🕒 Orari: '+esc(x.hours):'🟢 Attività trovata'}</div><button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}','_blank')">🧭 PORTAMI QUI</button></div>`}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c]))}function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}function isOpenNow(raw){const s=raw.toLowerCase();if(s.includes('24/7'))return true;const m=s.match(/(\d{1,2}):?(\d{2})?\s*-\s*(\d{1,2}):?(\d{2})?/);if(!m)return false;const now=new Date(),cur=now.getHours()*60+now.getMinutes(),a=+m[1]*60+(m[2]?+m[2]:0),b=+m[3]*60+(m[4]?+m[4]:0);return b<a?(cur>=a||cur<=b):(cur>=a&&cur<=b)}</script></body></html>
